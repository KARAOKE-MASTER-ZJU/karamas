name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_VERSION: "1.98.1"

jobs:
  frontend:
    name: 前端检查
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: 检出源码
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: 安装 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: 安装 pnpm 并恢复缓存
        uses: pnpm/action-setup@v6
        with:
          cache: true

      - name: 安装前端依赖
        run: pnpm install --frozen-lockfile

      - name: 检查前端代码
        run: pnpm lint

      - name: 检查文件格式
        run: pnpm format:check

      - name: 检查 TypeScript 类型
        run: pnpm check

      - name: 构建前端
        run: pnpm build

  desktop:
    name: Rust 检查（${{ matrix.os }}）
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - name: 检出源码
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: 安装 Linux 系统依赖
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential libwebkit2gtk-4.1-dev libxdo-dev \
            libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt

      - name: 恢复 Rust 缓存
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: 检查应用层 Rust 格式
        if: runner.os == 'Linux'
        run: cargo fmt -p karamas --check

      - name: 检查 Rust 工作区
        run: cargo check --workspace --locked

      - name: 运行核心库测试
        if: runner.os == 'Linux'
        run: cargo test -p karamas_core --lib --locked

      - name: 运行应用层测试
        if: runner.os == 'Linux'
        run: cargo test -p karamas --lib --locked

  android:
    name: Android arm64 编译检查
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      NDK_VERSION: "30.0.16248370"
    steps:
      - name: 检出源码
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: 安装 SDK 工具所需的 JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: 安装 Android NDK
        uses: android-actions/setup-android@v4
        with:
          packages: ndk;${{ env.NDK_VERSION }}
          log-accepted-android-sdk-licenses: false

      - name: 安装 bindgen 依赖
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libclang-dev

      - name: 安装 Rust 和 Android 编译目标
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: aarch64-linux-android

      - name: 恢复 Rust 缓存
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          key: android-aarch64-${{ env.NDK_VERSION }}

      - name: 检查 Android 目标的 Rust 工作区
        run: |
          toolchain="$ANDROID_HOME/ndk/$NDK_VERSION/toolchains/llvm/prebuilt/linux-x86_64"
          export CC_aarch64_linux_android="$toolchain/bin/aarch64-linux-android24-clang"
          export AR_aarch64_linux_android="$toolchain/bin/llvm-ar"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$CC_aarch64_linux_android"
          # 与应用的 minSdk 24 保持一致，QuickJS bindgen 使用 NDK 的目标头文件。
          export BINDGEN_EXTRA_CLANG_ARGS_aarch64_linux_android="--target=aarch64-linux-android24 --sysroot=$toolchain/sysroot -I$toolchain/sysroot/usr/include/aarch64-linux-android"
          cargo check --workspace --target aarch64-linux-android --locked
