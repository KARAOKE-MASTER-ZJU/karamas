[package]
name = "karamas"
version = "0.2.0"
edition = "2024"
license = "MIT"
publish = false

[lib]
name = "karamas_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = [] }
karamas_core = { path = "../../karamas_core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.54.1", features = ["sync", "fs", "io-util"] }
log = { version = "0.4.34", features = ["std"] }
flexi_logger = { version = "0.31.10", default-features = false }
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
url = "2.5.8"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "json"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
tauri-plugin-opener = "2.7.2"
tauri-plugin-dialog = "2.8.3"
tauri-plugin-fs = "2.7.1"

[target.'cfg(target_os = "android")'.dependencies]
jni = { version = "0.22.4", default-features = false }
rustls-platform-verifier = { version = "0.7.1", default-features = false }
semver = { version = "1", features = ["serde"] }
sha2 = "0.11.1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSScreen", "NSGraphics"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSDictionary", "NSEnumerator", "NSString", "NSValue"] }
core-graphics = "0.25.0"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Devices_Display"] }

[target.'cfg(any(target_os = "android", target_os = "ios", target_os = "macos"))'.dependencies]
tauri-plugin-sharekit = "0.3.1"

[target.'cfg(any(target_os = "macos", target_os = "windows", target_os = "linux"))'.dependencies]
tauri-plugin-updater = "2.14.1"
