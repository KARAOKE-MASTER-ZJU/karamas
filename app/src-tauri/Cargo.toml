[package]
name = "karamas"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "karamas_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = [] }
karamas_core = { path = "../../karamas_core" }
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.54.1", features = ["sync"] }
log = { version = "0.4.34", features = ["std"] }
flexi_logger = { version = "0.31.10", default-features = false }
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
url = "2.5.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
tauri-plugin-opener = "2.7.2"
tauri-plugin-dialog = "2.8.3"
tauri-plugin-fs = "2.7.1"
tauri-plugin-sharekit = "0.3.1"
