[package]
name = "karamas_core"
version = "0.2.0"
edition = "2024"

[lib]
name = "karamas_core"
path = "src/lib.rs"

[dependencies]
# 媒体代理只提供 HTTP/1 路由，不使用服务端压缩、Cookie 或 HTTP/2。
actix-web = { version = "4.18.1", default-features = false, features = ["macros", "unicode"] }
chrono = "0.4.45"
futures = "0.3.34"
futures-util = "0.3.34"
getifaddrs = "0.6.2"
local-ip-address = "0.6.13"
log = "0.4.34"
socket2 = "0.6.5"

reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "stream",
    "rustls-tls-webpki-roots",
] }

rustls = { version = "0.23.46", default-features = false, features = [
    "ring",
    "std",
    "tls12",
] }

tokio-tungstenite = { version = "0.30.0", default-features = false, features = [
    "rustls-tls-webpki-roots",
    "connect",
    "handshake",
] }

rupnp = "3.0.0"
roxmltree = "0.21.2"
serde = "1.0.229"
serde_json = "1.0.154"
mp4 = "0.14.0"
tokio = { version = "1.54.1", features = ["full"] }
url = "2.5.8"
urlencoding = "2.1.3"
anyhow = "1.0.104"
async-trait = "0.1.92"
bytes = "1.12.1"
md5 = "0.8.1"
innertube-rs = "0.9.0"
base64 = "0.23.1"
prost = "0.14.4"
prost-types = "0.14.4"
tonic = { version = "0.14.6", default-features = false, features = ["channel", "codegen", "tls-ring", "tls-webpki-roots"] }
tonic-prost = "0.14.6"
tokio-stream = "0.1.19"
uuid = { version = "1.29.0", features = ["v4"] }

[target.'cfg(any(target_os = "android", all(target_os = "windows", any(target_arch = "x86", target_arch = "aarch64"))))'.dependencies]
# rquickjs 0.9 未提供 Android、Windows x86 和 ARM64 的绑定，按目标平台生成。
rquickjs = { version = "0.9.0", default-features = false, features = ["bindgen"] }

[features]
default = []

[dev-dependencies]
env_logger = "0.11.11"
tokio = { version = "1.54.1", features = ["test-util"] }
