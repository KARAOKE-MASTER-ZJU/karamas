[package]
name = "ktv-casting"
version = "1.11.0"
edition = "2024"

[lib]
name = "ktv_casting_lib"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"] # 加上 rlib 方便 main.rs 引用

[[bin]]
name = "ktv-cli"
path = "src/main.rs"


[dependencies]
actix-files = "0.6.9"
actix-web = "4.12.1"
chrono = "0.4.42"
futures = "0.3.31"
futures-util = "0.3.31"
local-ip-address = "0.6.8"
log = "0.4.29"

reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "stream",
    "rustls-tls-webpki-roots",
] }

rustls = { version = "0.23", default-features = false, features = [
    "ring",
    "std",
    "tls12",
] }

tokio-tungstenite = { version = "0.28.0", default-features = false, features = [
    "rustls-tls-webpki-roots",
    "connect",
    "handshake",
] }

rupnp = "3.0.0"
roxmltree = "0.20"
serde = "1.0.228"
serde_json = "1.0.149"
mp4 = "0.14.0"
tokio = { version = "1.49.0", features = ["full"] }
url = "2.5.8"
urlencoding = "2.1.3"
anyhow = "1.0"
async-trait = "0.1"
bytes = "1.10"
md5 = "0.7"
innertube-rs = "0.9.0"

# CLI 专用依赖（仅非 Android target 可见）
[target.'cfg(not(target_os = "android"))'.dependencies]
crossterm = "0.29.0"
indicatif = "0.18.3"
env_logger = "0.11.8"
qr2term = "0.2"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
android_logger = "0.15.1"
# rquickjs 0.9 does not bundle Android bindings. Generate them against the NDK
# for each ABI; this unifies the feature on innertube-rs's existing dependency.
rquickjs = { version = "0.9.0", default-features = false, features = ["bindgen"] }

[features]
default = []

[dev-dependencies]
tokio = { version = "1.49.0", features = ["test-util"] }
