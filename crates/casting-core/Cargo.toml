[package]
name = "ktv-casting"
version = "1.11.0"
edition = "2024"

[lib]
name = "ktv_casting_lib"
path = "src/lib.rs"

[dependencies]
actix-files = "0.6.9"
actix-web = "4.12.1"
chrono = "0.4.42"
futures = "0.3.31"
futures-util = "0.3.31"
local-ip-address = "0.6.8"
log = "0.4.29"

reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "stream",
    "rustls-tls-webpki-roots",
] }

rustls = { version = "0.23", default-features = false, features = [
    "ring",
    "std",
    "tls12",
] }

tokio-tungstenite = { version = "0.28.0", default-features = false, features = [
    "rustls-tls-webpki-roots",
    "connect",
    "handshake",
] }

rupnp = "3.0.0"
roxmltree = "0.20"
serde = "1.0.228"
serde_json = "1.0.149"
mp4 = "0.14.0"
tokio = { version = "1.49.0", features = ["full"] }
url = "2.5.8"
urlencoding = "2.1.3"
anyhow = "1.0"
async-trait = "0.1"
bytes = "1.10"
md5 = "0.7"
innertube-rs = "0.9.0"
base64 = "0.22"
prost = "0.13"
prost-types = "0.13"
tonic = { version = "0.12", default-features = false, features = ["channel", "codegen", "prost", "tls-webpki-roots"] }
tokio-stream = "0.1"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(target_os = "android")'.dependencies]
# rquickjs 0.9 does not bundle Android bindings. Generate them against the NDK
# for each ABI; this unifies the feature on innertube-rs's existing dependency.
rquickjs = { version = "0.9.0", default-features = false, features = ["bindgen"] }

[features]
default = []

[dev-dependencies]
env_logger = "0.11.8"
tokio = { version = "1.49.0", features = ["test-util"] }
